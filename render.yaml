    name: fashionstore-platform
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_HOST_USER
        value: mrgrueso2005@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: plwx ztda stmt qxeu
      - key: DEFAULT_FROM_EMAIL
        value: SIGEPSI <mrgrueso2005@gmail.com>
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_CURRENCY
        value: bob
      - key: FORCE_SEED
        value: "false"
