name: fashionstore_mobile
description: "Plataforma E-Commerce Omnicanal para Ropa Masculina con RA (Ciclo 1)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.1.0
  provider: ^6.1.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  speech_to_text: ^7.5.0
  camera: ^0.12.1
  google_mlkit_commons: ^0.13.0
  google_mlkit_pose_detection: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ar_models/
